# pi-route example config.
#
# Operational settings (port, host, tokens, paths) live in env vars:
#   PI_ROUTE_PORT    listen port            (default 3000)
#   PI_ROUTE_HOST    listen host            (default 127.0.0.1)
#   PI_ROUTE_TOKEN   comma-separated client bearer tokens; unset = no gate
#   PI_ROUTE_CONFIG  path to this file      (default ~/.config/pi-route/config.yaml)
#   PI_ROUTE_AUTH    OAuth + state.json dir (default ~/.local/share/pi-route/auth)

# Atomic upstream connections. One provider = one account.
providers:
  claude-max:
    type: anthropic
    account: your-email@example.com   # run: pi-route provider claude-max auth anthropic

  antigravity:
    type: antigravity
    account: user@gmail.com

  # A key-credential provider. `apiKey` is first-class — a literal, or a $VAR
  # read from the environment. Register it without hand-editing via:
  #   pi-route provider chutes set --url https://llm.chutes.ai/v1 --key-env CHUTES_API_KEY
  # chutes:
  #   type: openai-compatible
  #   baseUrl: https://llm.chutes.ai/v1
  #   apiKey: $CHUTES_API_KEY
  # Convert structured response formats for providers that do not support them natively.
  #   formatTranslation: constrained-tool  # auto (default), native, constrained-tool
  #   structuredOutputApi: openai-completions  # send schema requests down this api
  #     # For OpenRouter: its catalog entry for anthropic/* is the anthropic-messages
  #     # compat endpoint, which refuses strict tools. openai-completions is
  #     # OpenRouter's native api and enforces response_format, $defs included.
  #
  # Where a schema can only be enforced through the private constrained tool
  # (anthropic-messages providers such as a Claude-subscription `cc`), pi-route
  # normalises it first: local $defs/$ref are inlined, and the numeric keywords
  # Anthropic's tool validator rejects — minimum, maximum, exclusiveMinimum,
  # exclusiveMaximum, multipleOf — are dropped, because it refuses the request
  # outright otherwise. The enforced schema is then weaker than the one asked for,
  # so each dropped keyword is logged and recorded on the request span as
  # `pi.structured_output.dropped_keywords`. Native routes are untouched: a
  # provider reached through structuredOutputApi gets the schema verbatim.

# Server-facing settings: the gate token and the OpenCode /api.json masquerade.
# server:
#   One bearer token the server accepts. Clients present the same value as their
#   API key (PI_ROUTE_API_KEY). Prefer $VAR or the systemd credential over a literal.
#   authToken: $PI_ROUTE_AUTH_TOKEN
#
#   Serve /api.json (models.dev shape) so OpenCode can discover models.
#   opencode: true

# Routing pipeline. Each entry's YAML value shape declares its semantics:
#   key: target           → alias (rewrite bare name to target)
#   key: [m1, m2, ...]    → pool (balance across members; default round-robin).
#                           A bare list matches `key/**`, NOT the bare name `key`.
#   key: {to, strategy?, when?, match?}  → full entry
#
# A named fallback chain (bare `model: key`, try members in order) needs the full form:
#   default: {match: exact, strategy: failover, to: [provA/m1, provB/m2]}
pipeline:
  # Aliases — convenient short names for common Claude models.
  opus:    claude-max/claude-opus-4-7
  sonnet:  claude-max/claude-sonnet-4-6
  haiku:   claude-max/claude-haiku-4-5

# Public-surface filter for /v1/models. Empty / omitted = all reachable.
# Use gitignore-style patterns:
#   `claude-max/**`          — allow everything under that prefix
#   `!**/claude-3-*`         — exclude (after allow)
expose: []
